[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anchortest"
version = "0.1.0"
description = "Stop trusting a single backtest run: anchor-average across every phase of your cycle, compare candidates without the drawdown sign trap, and catch blending artifacts before you ship a strategy."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { email = "grant02339@gmail.com" },
]
keywords = ["backtesting", "quant", "trading", "overfitting", "validation", "finance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/grant02339-ship-it/anchortest"
Repository = "https://github.com/grant02339-ship-it/anchortest"

[tool.hatch.build.targets.wheel]
packages = ["src/anchortest"]
